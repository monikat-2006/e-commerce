<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart E-Commerce Data Warehouse Inventory Management System - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <h2>Inventory Management System</h2>
            <p>Welcome back! Please login to your account.</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Email or Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="email" name="email" required placeholder="Enter your email or username">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
            </div>

            <div class="form-group role-selection">
                <p>Select Role:</p>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="role" value="staff" checked> Staff
                    </label>
                    <label>
                        <input type="radio" name="role" value="admin"> Admin
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe"> Remember Me
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </form>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
